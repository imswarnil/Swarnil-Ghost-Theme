# Cuts a release of the theme.
#
# Triggered by pushing a tag: `npm run release:patch` (or :minor / :major) bumps
# the version, updates the changelog heading, commits, tags and pushes — this
# workflow does the rest.
#
#   tag pushed
#     → build, lint, gscan
#     → package swarnil.zip
#     → publish a GitHub Release with the zip and the documentation PDF attached
#     → deploy-theme.yml picks up `release: published` and ships it to Ghost
#
# The two are separate on purpose. Building a release is safe and repeatable;
# putting it on a live site is neither, so it is its own workflow with its own
# credentials and its own audit trail.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog extract below reads the working tree, not the API.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # A tag that disagrees with package.json produces a release whose asset
      # reports a different version from its own title. Catch it before anything
      # is published, because a release cannot be quietly corrected.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg."
            echo "Use 'npm run release:patch|minor|major', which keeps them in step."
            exit 1
          fi
          echo "v$pkg"

      - name: Verify
        run: npm run verify

      - name: Package
        run: npm run zip

      # The release notes are the changelog section for this version. Keeping
      # one source means the notes cannot say something the repository does not.
      - name: Extract the release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/     { exit }
            capture                 { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section found for $version — add one to CHANGELOG.md." >&2
            exit 1
          fi
          wc -l < RELEASE_NOTES.md | xargs echo "notes lines:"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Swarnil ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            swarnil.zip \
            docs/assets/docs.pdf
