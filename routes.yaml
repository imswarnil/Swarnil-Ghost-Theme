# Routing for the Swarnil theme.
#
# Ghost reads this file only when a publisher uploads it under
# Settings → Labs → Routes. Installing the theme does not apply it, so the theme
# is built to work correctly without it: Ghost picks up home.hbs for "/" on its
# own, and every other template is reached by Ghost's own hierarchy.
#
# All it adds is /blog/ — every post, paginated, at a stable URL you can put in
# the navigation.
#
# Note there is deliberately no `filter` on the collection. Every post belongs
# to exactly one collection and takes its URL from it, so filtering the only
# collection leaves the excluded posts with no URL at all — still published,
# still in admin, and unreachable. A channel, used here, does not own permalinks
# and cannot cause that.

routes:
  /blog/:
    controller: channel
    template: index

collections:
  /:
    permalink: /{slug}/
    template: home

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
